<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>

  <header>
    <div class="nav-inner">
      <div class="logo">ATS Student Portfolio</div>
      <button class="hamburger" aria-label="Toggle menu">
        <span></span>
      </button>
      <nav>
        <ul id="main-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="skills.html">Skills</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="gallery.html">Photo Gallery</a></li>
          <li><a href="contact.html">Contact Us</a></li>
          <li><a href="game.html">Play Game</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h2 class="section-title">Contact Us</h2>

      <div class="form-card">
        <form id="contact-form">
          <div class="form-row">
            <label for="full-name">Full Name *</label>
            <input type="text" id="full-name" name="full-name" required placeholder="Your name">
          </div>

          <div class="form-row">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
          </div>

          <div class="form-row">
            <label for="topic">Topic *</label>
            <select id="topic" name="topic" required>
              <option value="">Choose a topic</option>
              <option value="projects">Projects</option>
              <option value="collab">Collaboration</option>
              <option value="feedback">Feedback</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-row">
            <span>Preferred Contact *</span>
            <div class="form-inline">
              <label>
                <input type="radio" name="preferred" value="email" required>
                Email
              </label>
              <label>
                <input type="radio" name="preferred" value="phone">
                Phone
              </label>
            </div>
          </div>

          <div class="form-row">
            <span>Interests</span>
            <div class="form-inline">
              <label>
                <input type="checkbox" name="interests" value="robotics">
                Robotics
              </label>
              <label>
                <input type="checkbox" name="interests" value="coding">
                Coding
              </label>
              <label>
                <input type="checkbox" name="interests" value="ai">
                AI
              </label>
            </div>
          </div>

          <div class="form-row">
            <label for="message">Message *</label>
            <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
          </div>

          <div class="form-row form-inline">
            <button type="submit" class="btn">Send</button>
            <button type="reset" class="btn btn-outline">Reset</button>
          </div>
        </form>

        <div id="contact-success" class="game-message" style="display:none; color: var(--success);">
          Thank you! Your message was sent successfully.
        </div>
      </div>
    </div>

    <footer>
      © 2026 · ATS Student Portfolio · Made with HTML, CSS & JS
    </footer>
  </main>
</body>
</html>
